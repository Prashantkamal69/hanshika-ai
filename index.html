<!DOCTYPE html><html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>HANSHIKA AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111827;
    }
    header {
      padding: 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 6px 0 0; color: #94a3b8; font-size: 14px; }
    #chat {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 90%;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .ai { background: #263449; align-self: flex-start; }
    .user { background: #2563eb; align-self: flex-end; }
    #status { padding: 0 16px 8px; color: #fbbf24; font-size: 13px; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
    }
    textarea {
      flex: 1;
      resize: none;
      min-width: 0;
      height: 48px;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      padding: 0 18px;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>✨ HANSHIKA AI</h1>
      <p>आपका AI चैट असिस्टेंट</p>
    </header><section id="chat" aria-live="polite">
  <div class="message ai">नमस्ते! ❤️ मैं HANSHIKA AI हूँ। मुझसे कुछ भी पूछिए।</div>
</section>

<div id="status" role="status"></div>

<form id="form">
  <textarea id="message" placeholder="अपना मैसेज लिखें..." required></textarea>
  <button id="send" type="submit">भेजें</button>
</form>

  </main>  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      status.textContent = "HANSHIKA AI जवाब तैयार कर रही है...";

      const reply = addMessage("सोच रही हूँ...", "ai");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "अनुरोध पूरा नहीं हुआ।");
        }

        reply.textContent = data.reply || "कोई जवाब नहीं मिला।";
      } catch (error) {
        reply.textContent = "माफ़ कीजिए! " + error.message;
      } finally {
        send.disabled = false;
        status.textContent = "";
        input.focus();
      }
    });
  </script></body>
</html>
