
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANSHIKA AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111b;
      color: white;
    }
    header {
      padding: 20px;
      background: #6d42d8;
      font-size: 23px;
      font-weight: bold;
    }
    #chat {
      height: calc(100dvh - 155px);
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      padding: 12px 15px;
      border-radius: 15px;
      margin: 12px 0;
      max-width: 90%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .user {
      background: #6d42d8;
      margin-left: auto;
    }
    .ai {
      background: #252638;
      margin-right: auto;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1b1c29;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #555;
      background: #292a3a;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: #8057ed;
      color: white;
      font-size: 16px;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <header>✦ HANSHIKA AI</header>
  <main id="chat">
    <div class="msg ai">नमस्ते! 😊 मैं HANSHIKA AI हूँ। मुझसे कुछ भी पूछो!</div>
  </main>

  <form id="form">
    <input id="message" placeholder="यहाँ अपना सवाल लिखो..."
      autocomplete="off" required>
    <button id="send" type="submit">भेजें</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      const reply = addMessage("जवाब आ रहा है...", "ai");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "सर्वर में समस्या है।");
        }
        reply.textContent = data.reply || "कोई जवाब नहीं मिला।";
      } catch (error) {
        reply.textContent =
          "अभी AI सर्वर से कनेक्शन नहीं हुआ। सर्वर सेटअप पूरा करना बाकी है।";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
